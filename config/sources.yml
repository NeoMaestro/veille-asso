sources:
  - name: "Associations.gouv.fr"
    url: "https://www.associations.gouv.fr/spip.php?page=backend"
    enabled: false
    description: "Flux historique a verifier avant activation: peut retourner une erreur selon le site."

  - name: "INJEP"
    url: "https://injep.fr/feed/"
    enabled: true
    description: "Jeunesse, education populaire, vie associative."

  - name: "Vie-publique.fr"
    url: "https://www.vie-publique.fr/rss.xml"
    enabled: false
    description: "Source utile mais a verifier avant activation: le flux peut ne retourner aucun element."

  - name: "Education.gouv.fr"
    url: "https://www.education.gouv.fr/rss.xml"
    enabled: false
    description: "Source utile mais a verifier avant activation: certains acces RSS peuvent etre bloques."

  - name: "Exemple de source locale"
    url: "https://example.org/feed.xml"
    enabled: false
    description: "Remplacez cette entree par le flux de votre CAF, mairie, SDJES, DRAJES ou federation."
